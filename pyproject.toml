[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "stm32-jlink-mcp"
version = "0.1.0"
description = "MCP server for AI-assisted STM32 debugging through SEGGER J-Link"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
dependencies = [
  "mcp>=2,<3",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "pyelftools>=0.31,<1",
  "pygdbmi>=0.11.0.0,<1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.9,<1"
]

[project.scripts]
stm32-jlink-mcp = "stm32_jlink_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/stm32_jlink_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
